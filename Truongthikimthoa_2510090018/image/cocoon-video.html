S.push({h:'<div class="big">the cocoon</div>',t:'Đẹp từ thiên nhiên Việt Nam',bg:'#2f4a36',fg:'#f2ede3',d:1800,say:'Đẹp từ thiên nhiên Việt Nam.',c:1});
S.forEach(s=>{const e=document.createElement('div');e.className='s'+(s.c?' c':'');e.innerHTML=(s.img?'<img src="'+s.img+'">':'')+'<div class="tx">'+s.h+'<p>'+s.t+'</p>'+(s.tag?'<div class="tag">'+s.tag+'</div>':'')+'</div>';s.e=e;v.appendChild(e)});
const T=S.reduce((a,s)=>a+s.d,0);let i=0,el=0,acc=0,paused=true,last=performance.now();
function speak(t){try{ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=1.2;const vv=ss.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('vi'));if(vv)u.voice=vv;ss.speak(u)}catch(e){}}
function go(n){i=n;acc=S.slice(0,n).reduce((a,s)=>a+s.d,0);el=0;S.forEach((s,k)=>s.e.classList.toggle('on',k==n));v.style.background=S[n].bg;v.style.color=S[n].fg;speak(S[n].say)}
function tick(now){const dt=now-last;last=now;if(!paused){el+=dt;if(el>=S[i].d){if(i<S.length-1)go(i+1);else{paused=true;el=S[i].d;pp.textContent='▶ Phát'}}}
bar.style.width=Math.min(100,(acc+el)/T*100)+'%';requestAnimationFrame(tick)}
const pp=document.getElementById('pp');
document.getElementById('go').onclick=()=>{document.getElementById('st').style.display='none';paused=false;go(0)};
pp.onclick=()=>{paused=!paused;pp.textContent=paused?'▶ Phát':'⏸ Tạm dừng';try{paused?ss.pause():ss.resume()}catch(e){}};
document.getElementById('rp').onclick=()=>{document.getElementById('st').style.display='none';paused=false;pp.textContent='⏸ Tạm dừng';go(0)};
S[0].e.classList.add('on');requestAnimationFrame(tick);
</script></body></html>
